{% extends "base.html" %}{% block body %}
<h1>Courses</h1>
<div class="card"><form method="post" class="inline"><input name="code" placeholder="Code (CS101)" required>
<input name="name" placeholder="Course name" required><button class="btn">Add course</button></form></div>
<div class="card"><table><tr><th>Code</th><th>Name</th></tr>
{% for c in courses %}<tr><td>{{ c.code }}</td><td>{{ c.name }}</td></tr>{% else %}<tr><td colspan="2" class="muted">No courses yet.</td></tr>{% endfor %}</table></div>
{% endblock %}
