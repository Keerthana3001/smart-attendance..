{% extends "base.html" %}{% block body %}
<h1>Reports</h1>
<div class="card"><form method="get" class="inline"><select name="course_id"><option value="">All courses</option>
{% for c in courses %}<option value="{{ c.id }}" {{ 'selected' if c.id == course_id }}>{{ c.code }}</option>{% endfor %}</select>
<button class="btn light">Filter</button>
<a class="btn" href="{{ url_for('export_csv', course_id=course_id) }}">Export CSV</a></form></div>
<div class="card"><table><tr><th>Roll</th><th>Name</th><th>Course</th><th>Present / Total</th><th>Attendance</th></tr>
{% for r in rows %}<tr><td>{{ r.roll_no }}</td><td>{{ r.name }}</td><td>{{ r.code }}</td><td>{{ r.present }} / {{ r.total }}</td>
<td><span class="bar"><i class="{{ 'low' if r.pct < threshold }}" style="width:{{ r.pct }}%"></i></span>
<span class="pill {{ 'low' if r.pct < threshold else 'good' }}">{{ r.pct }}%</span></td></tr>
{% else %}<tr><td colspan="5" class="muted">No attendance recorded yet.</td></tr>{% endfor %}</table></div>
{% endblock %}
