{% extends "base.html" %}{% block body %}
<h1>Students</h1>
<div class="card"><form method="post" class="inline">
<input name="roll_no" placeholder="Roll No" required><input name="name" placeholder="Full name" required>
<input name="email" type="email" placeholder="Email"><input name="class_name" placeholder="Class">
<button class="btn">Add student</button></form></div>
<div class="card"><table><tr><th>Roll</th><th>Name</th><th>Email</th><th>Class</th><th></th></tr>
{% for s in students %}<tr><td>{{ s.roll_no }}</td><td>{{ s.name }}</td><td>{{ s.email }}</td><td>{{ s.class_name }}</td>
<td><form method="post" action="{{ url_for('delete_student', sid=s.id) }}" onsubmit="return confirm('Delete this student and their records?')"><button class="btn danger">Delete</button></form></td></tr>
{% else %}<tr><td colspan="5" class="muted">No students yet.</td></tr>{% endfor %}</table></div>
{% endblock %}
